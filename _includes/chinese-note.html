<li class="chinese-note" data-note-id="{{ include.note.id }}" lang="zh-CN">
  <a href="{{ include.note.url | escape }}" target="_blank" rel="noopener">{{ include.note.title | escape }} <span class="note-english" lang="en">· {{ include.note.english | escape }}</span></a>
  <span class="note-meta"><span class="language-label">中文</span> <span lang="en">{{ include.note.category | escape }}</span></span>
</li>
